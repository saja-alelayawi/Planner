<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5fb;--surface:#fff;--ink:#241b35;--muted:#7a7090;--line:#e8e2f3;--p:#7c3aed;--p-soft:#efe7fe;--p-ink:#fff;--ok:#16a34a;--danger:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f21;--surface:#1f1730;--ink:#f1ecfb;--muted:#9d92b5;--line:#33284b;--p:#a78bfa;--p-soft:#2c2146;--p-ink:#1a1030;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f21;--surface:#1f1730;--ink:#f1ecfb;--muted:#9d92b5;--line:#33284b;--p:#a78bfa;--p-soft:#2c2146;--p-ink:#1a1030;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{padding:24px 16px;border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh}
nav h1{font-size:19px;margin:0 8px 24px;font-weight:700;letter-spacing:-.02em}
nav button{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:4px;border:0;border-radius:10px;background:none;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--p-soft);color:var(--p)}
main{padding:28px;min-width:0;max-width:1100px}
h2{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
button.pri,button.sec{font:inherit;font-weight:600;border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--p)}
button.pri{background:var(--p);color:var(--p-ink)}
button.sec{background:none;color:var(--p)}
button.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
button.x:hover{color:var(--danger)}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
textarea{width:100%;min-height:140px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
/* calendar */
.cal{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.cal-in{min-width:680px}
.cal-h,.cal-b{display:grid;grid-template-columns:52px repeat(7,1fr)}
.cal-h div{padding:10px 4px;text-align:center;font-weight:600;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.cal-h .today{color:var(--p)}
.hrs div{height:48px;font-size:11px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-7px)}
.col{position:relative;border-left:1px solid var(--line);height:720px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--line) 47px,var(--line) 48px);cursor:pointer}
.col.today{background-color:var(--p-soft)}
.ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 7px;font-size:12px;font-weight:600;overflow:hidden;color:#fff;cursor:pointer;line-height:1.3}
.ev small{display:block;font-weight:500;opacity:.85}
/* classes */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.chip.on{background:var(--p);color:var(--p-ink);border-color:var(--p)}
.grade{display:flex;align-items:baseline;gap:12px}
.grade b{font-size:44px;letter-spacing:-.03em;color:var(--p)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px}
td{padding:4px}
td input{width:100%}
/* todo */
.todo{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.todo:last-child{border:0}
.todo input[type=checkbox]{width:20px;height:20px;accent-color:var(--p);flex:none}
.todo span{flex:1}
.todo.done span{text-decoration:line-through;color:var(--muted)}
.todo small{color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,10,40,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.open{display:flex}
.modal .card{width:100%;max-width:380px;margin:0;display:grid;gap:10px}
.modal label{font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:700px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;gap:4px;padding:12px;border-right:0;border-bottom:1px solid var(--line)}nav h1{display:none}nav button{text-align:center;margin:0}main{padding:18px}}
</style>
</head>
<body>
<div class="app">
<nav>
  <h1>My Planner</h1>
  <button data-v="cal" class="on">Calendar</button>
  <button data-v="cls">Classes</button>
  <button data-v="todo">To-do</button>
</nav>
<main id="main"></main>
</div>

<div class="modal" id="modal"><div class="card">
  <h2 style="font-size:20px" id="mt">Add event</h2>
  <div><label>Title</label><input id="e-title" style="width:100%" placeholder="e.g. Biology lecture"></div>
  <div><label>Date</label><input id="e-date" type="date" style="width:100%"></div>
  <div class="row"><div style="flex:1"><label>Start</label><input id="e-s" type="time" style="width:100%"></div><div style="flex:1"><label>End</label><input id="e-e" type="time" style="width:100%"></div></div>
  <div><label>Class (optional)</label><select id="e-c" style="width:100%"></select></div>
  <div class="row" style="justify-content:space-between"><button class="x" id="e-del" style="font-size:14px">Delete</button><div class="row"><button class="sec" id="e-cancel">Cancel</button><button class="pri" id="e-save">Save</button></div></div>
</div></div>

<script>
var COLORS=["#7c3aed","#c026d3","#4f46e5","#9333ea","#6d28d9","#a21caf","#5b21b6"];
var S={events:[],classes:[],todos:[]},view="cal",week=startOfWeek(new Date()),selCls=null,editing=null;
try{var raw=localStorage.getItem("planner-v1");if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem("planner-v1",JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function startOfWeek(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function mins(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function fmt(t){var p=t.split(":"),h=+p[0];return (h%12||12)+(p[1]!=="00"?":"+p[1]:"")+(h<12?"a":"p")}
function clsColor(id){var i=S.classes.findIndex(function(c){return c.id===id});return i<0?COLORS[0]:COLORS[i%COLORS.length]}

document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){view=b.dataset.v;document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x===b)});render()}});

function render(){$("main").innerHTML=view==="cal"?calHTML():view==="cls"?clsHTML():todoHTML();if(view==="cal")bindCal();if(view==="cls")bindCls();if(view==="todo")bindTodo()}

/* ---------- calendar ---------- */
function calHTML(){
  var days=[],i,today=iso(new Date());
  for(i=0;i<7;i++){var d=new Date(week);d.setDate(d.getDate()+i);days.push(d)}
  var DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var rng=days[0].toLocaleDateString(undefined,{month:"short",day:"numeric"})+" – "+days[6].toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  var h='<h2>Schedule</h2><p class="sub">Click any time slot to add something to your day.</p><div class="bar"><b>'+rng+'</b><div class="row"><button class="sec" id="prev">‹</button><button class="sec" id="tod">Today</button><button class="sec" id="next">›</button></div></div><div class="cal"><div class="cal-in"><div class="cal-h"><div></div>';
  days.forEach(function(d,i){h+='<div class="'+(iso(d)===today?"today":"")+'">'+DN[i]+" "+d.getDate()+"</div>"});
  h+='</div><div class="cal-b"><div class="hrs">';
  for(i=7;i<22;i++)h+="<div>"+(i%12||12)+(i<12?"a":"p")+"</div>";
  h+="</div>";
  days.forEach(function(d){
    var k=iso(d);h+='<div class="col'+(k===today?" today":"")+'" data-d="'+k+'">';
    S.events.filter(function(e){return e.date===k}).forEach(function(e){
      var top=(mins(e.start)-420)/60*48,ht=Math.max(22,(mins(e.end)-mins(e.start))/60*48-2);
      h+='<div class="ev" data-id="'+e.id+'" style="top:'+top+'px;height:'+ht+'px;background:'+clsColor(e.cls)+'">'+esc(e.title)+"<small>"+fmt(e.start)+"–"+fmt(e.end)+"</small></div>"});
    h+="</div>"});
  return h+"</div></div></div>"}
function bindCal(){
  $("prev").onclick=function(){week.setDate(week.getDate()-7);render()};
  $("next").onclick=function(){week.setDate(week.getDate()+7);render()};
  $("tod").onclick=function(){week=startOfWeek(new Date());render()};
  document.querySelectorAll(".col").forEach(function(c){c.onclick=function(ev){
    if(ev.target.closest(".ev"))return;
    var hr=Math.min(20,7+Math.floor(ev.offsetY/48)),p=function(n){return String(n).padStart(2,"0")+":00"};
    openEv({date:c.dataset.d,start:p(hr),end:p(hr+1),title:"",cls:""})}});
  document.querySelectorAll(".ev").forEach(function(el){el.onclick=function(){openEv(S.events.find(function(e){return e.id===el.dataset.id}))}})}
function openEv(e){
  editing=e;$("mt").textContent=e.id?"Edit event":"Add event";
  $("e-title").value=e.title;$("e-date").value=e.date;$("e-s").value=e.start;$("e-e").value=e.end;
  $("e-c").innerHTML='<option value="">No class</option>'+S.classes.map(function(c){return'<option value="'+c.id+'"'+(c.id===e.cls?" selected":"")+">"+esc(c.name)+"</option>"}).join("");
  $("e-del").style.display=e.id?"":"none";$("modal").classList.add("open");$("e-title").focus()}
$("e-cancel").onclick=function(){$("modal").classList.remove("open")};
$("e-save").onclick=function(){
  var t=$("e-title").value.trim(),s=$("e-s").value,en=$("e-e").value;
  if(!t||!$("e-date").value||!s||!en||mins(en)<=mins(s)){$("e-title").focus();return}
  var o={id:editing.id||uid(),title:t,date:$("e-date").value,start:s,end:en,cls:$("e-c").value};
  if(editing.id)S.events=S.events.map(function(x){return x.id===o.id?o:x});else S.events.push(o);
  save();$("modal").classList.remove("open");render()};
$("e-del").onclick=function(){S.events=S.events.filter(function(x){return x.id!==editing.id});save();$("modal").classList.remove("open");render()};

/* ---------- classes ---------- */
function calcGrade(c){
  var g=c.assignments.filter(function(a){return a.score!==""&&a.score!=null&&+a.total>0});
  if(!g.length)return null;
  var w=g.filter(function(a){return +a.weight>0});
  if(w.length){var tw=0,sum=0;w.forEach(function(a){tw+=+a.weight;sum+=+a.score/+a.total*+a.weight});return sum/tw*100}
  var e=0,t=0;g.forEach(function(a){e+=+a.score;t+=+a.total});return e/t*100}
function letter(p){return p>=93?"A":p>=90?"A-":p>=87?"B+":p>=83?"B":p>=80?"B-":p>=77?"C+":p>=73?"C":p>=70?"C-":p>=60?"D":"F"}
function clsHTML(){
  var h='<h2>Classes</h2><p class="sub">Syllabus, assignments, and your grade for each class.</p><div class="chips">';
  S.classes.forEach(function(c){h+='<button class="chip'+(c.id===selCls?" on":"")+'" data-c="'+c.id+'">'+esc(c.name)+"</button>"});
  h+='</div><div class="row card"><input id="nc" placeholder="New class name (e.g. Chemistry 101)" style="flex:1"><button class="pri" id="addc">Add class</button></div>';
  var c=S.classes.find(function(x){return x.id===selCls});
  if(!c)return h+(S.classes.length?'<p class="empty">Pick a class above.</p>':'<p class="empty">Add your first class to get started.</p>');
  var g=calcGrade(c);
  h+='<div class="card"><div class="bar"><b style="font-size:18px">'+esc(c.name)+'</b><button class="x" id="delc" style="font-size:14px">Delete class</button></div><div class="grade"><b>'+(g==null?"—":g.toFixed(1)+"%")+"</b><span>"+(g==null?"Enter scores below to see your grade":letter(g)+" · current grade")+"</span></div></div>";
  h+='<div class="card"><b>Syllabus</b><p class="sub" style="margin:2px 0 10px">Paste or type anything: policies, grading breakdown, due dates.</p><textarea id="syl" placeholder="Paste your syllabus here...">'+esc(c.syllabus)+"</textarea></div>";
  h+='<div class="card"><b>Assignments &amp; grades</b><p class="sub" style="margin:2px 0 10px">Add a weight (%) to use weighted grading, or leave it blank to total points.</p><table><tr><th>Assignment</th><th style="width:80px">Score</th><th style="width:80px">Out of</th><th style="width:80px">Weight %</th><th style="width:28px"></th></tr>';
  c.assignments.forEach(function(a){h+='<tr data-a="'+a.id+'"><td><input data-f="name" value="'+esc(a.name)+'"></td><td><input data-f="score" type="number" step="any" value="'+esc(a.score)+'"></td><td><input data-f="total" type="number" step="any" value="'+esc(a.total)+'"></td><td><input data-f="weight" type="number" step="any" value="'+esc(a.weight)+'"></td><td><button class="x" data-del="'+a.id+'">×</button></td></tr>'});
  return h+'</table><div style="margin-top:12px"><button class="sec" id="adda">+ Add assignment</button></div></div>'}
function bindCls(){
  document.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){selCls=b.dataset.c;render()}});
  $("addc").onclick=function(){var n=$("nc").value.trim();if(!n)return;var c={id:uid(),name:n,syllabus:"",assignments:[]};S.classes.push(c);selCls=c.id;save();render()};
  var c=S.classes.find(function(x){return x.id===selCls});if(!c)return;
  $("delc").onclick=function(){if(!confirm("Delete "+c.name+"?"))return;S.classes=S.classes.filter(function(x){return x!==c});selCls=null;save();render()};
  $("syl").oninput=function(){c.syllabus=this.value;save()};
  $("adda").onclick=function(){c.assignments.push({id:uid(),name:"",score:"",total:"100",weight:""});save();render()};
  document.querySelectorAll("tr[data-a] input").forEach(function(i){i.oninput=function(){
    var a=c.assignments.find(function(x){return x.id===i.closest("tr").dataset.a});a[i.dataset.f]=i.value;save();
    var g=calcGrade(c),b=document.querySelector(".grade b");b.textContent=g==null?"—":g.toFixed(1)+"%";b.nextElementSibling.textContent=g==null?"Enter scores below to see your grade":letter(g)+" · current grade"}});
  document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){c.assignments=c.assignments.filter(function(a){return a.id!==b.dataset.del});save();render()}})}

/* ---------- to-do ---------- */
function todoHTML(){
  var open=S.todos.filter(function(t){return!t.done}),done=S.todos.filter(function(t){return t.done});
  function item(t){return'<div class="todo'+(t.done?" done":"")+'"><input type="checkbox" data-t="'+t.id+'"'+(t.done?" checked":"")+'><span>'+esc(t.text)+(t.due?' <small>· due '+new Date(t.due+"T00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})+"</small>":"")+'</span><button class="x" data-rm="'+t.id+'">×</button></div>'}
  var h='<h2>To-do</h2><p class="sub">'+open.length+" left to do</p><div class=\"row card\"><input id=\"tt\" placeholder=\"Add a task or reminder\" style=\"flex:1;min-width:180px\"><input id=\"td\" type=\"date\"><button class=\"pri\" id=\"addt\">Add</button></div>";
  h+='<div class="card">'+(open.length?open.map(item).join(""):'<p class="empty">Nothing left. Add something above.</p>')+"</div>";
  if(done.length)h+='<div class="card"><div class="bar"><b>Completed</b><button class="sec" id="clr">Clear completed</button></div>'+done.map(item).join("")+"</div>";
  return h}
function bindTodo(){
  function add(){var t=$("tt").value.trim();if(!t)return;S.todos.push({id:uid(),text:t,due:$("td").value,done:false});save();render();$("tt").focus()}
  $("addt").onclick=add;$("tt").onkeydown=function(e){if(e.key==="Enter")add()};
  document.querySelectorAll("[data-t]").forEach(function(c){c.onchange=function(){var t=S.todos.find(function(x){return x.id===c.dataset.t});t.done=c.checked;save();render()}});
  document.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){S.todos=S.todos.filter(function(x){return x.id!==b.dataset.rm});save();render()}});
  if($("clr"))$("clr").onclick=function(){S.todos=S.todos.filter(function(x){return!x.done});save();render()}}

render();
</script>
</body>
</html>
